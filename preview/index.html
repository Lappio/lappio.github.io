      <h1>三套预览</h1>
      <p class="lead">正式首页没有换。下面三套只是并排看的方案，结构、字体和导航都不一样。默认中文。</p>
      <ol>
        <li>
          <a class="card" href="./a/">
            <strong>A · 刊</strong>
            <span>报纸式。大衬线标题，主稿加右侧索引，浅灰纸，一点红。</span>
          </a>
        </li>
        <li>
          <a class="card" href="./b/">
            <strong>B · 终端</strong>
            <span>等宽字，深色，左侧路径栏，内容排成密表。</span>
          </a>
        </li>
        <li>
          <a class="card" href="./c/">
            <strong>C · 空气</strong>
            <span>窄栏、大留白、圆角软表面，冷灰蓝，无衬线。</span>
          </a>
        </li>
      </ol>
      <p class="lead">每套方案里有一篇标明「不发布」的版式试样。示例笔记、项目和待填的联系方式都标了出来，没有编造个人经历。</p>
      <p class="live"><a href="../">回到正在使用的站点</a></p>
